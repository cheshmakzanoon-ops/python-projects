[project]
name = "pp-routecraft"
version = "0.1.0"
description = "Directed vehicle routing with time windows and independently verified rolling plans"
requires-python = ">=3.13"
dependencies = ["matplotlib>=3.10,<4"]
[project.scripts]
routecraft = "pp_routecraft.cli:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15"]
[tool.hatch.build.targets.wheel]
packages = ["src/pp_routecraft"]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.13"
strict = true
[tool.ruff]
extend = "../../ruff.toml"

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["pp_routecraft"]
[tool.coverage.report]
show_missing = true
