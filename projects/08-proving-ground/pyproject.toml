[project]
name = "pp-proving-ground"
version = "0.1.0"
description = "Proving-Ground: independent Python portfolio project"
requires-python = ">=3.13"
dependencies = ["numpy>=2.3", "scikit-learn>=1.7", "pyarrow>=20", "fastapi>=0.115", "uvicorn>=0.35", "skops>=0.13"]
[project.scripts]
proving-ground = "pp_proving_ground.cli:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15", "httpx>=0.28"]
[tool.hatch.build.targets.wheel]
packages = ["src/pp_proving_ground"]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.13"
strict = true
[tool.ruff]
extend = "../../ruff.toml"

[[tool.mypy.overrides]]
module = ["sklearn.*", "skops.*", "pyarrow.*"]
ignore_missing_imports = true
