[project]
name = "pp-resonance"
version = "0.1.0"
description = "Offline monophonic guitar analysis with original pitch, onset and alignment algorithms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.3", "scipy>=1.16", "soundfile>=0.13", "matplotlib>=3.10", "mido>=1.3"]
[project.scripts]
resonance = "pp_resonance.cli:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15"]
[tool.hatch.build.targets.wheel]
packages = ["src/pp_resonance"]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.13"
strict = true
[tool.ruff]
extend = "../../ruff.toml"

[[tool.mypy.overrides]]
module = ["scipy.*", "soundfile.*", "mido.*", "matplotlib.*"]
ignore_missing_imports = true
