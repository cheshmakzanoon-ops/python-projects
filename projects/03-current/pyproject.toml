[project]
name = "pp-current"
version = "0.1.0"
description = "Durable event-time processing with ordered ingress, late revisions, and recoverable checkpoints"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.16",
]
[project.scripts]
current = "pp_current.cli:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15"]
[tool.hatch.build.targets.wheel]
packages = ["src/pp_current"]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.13"
strict = true
[tool.ruff]
extend = "../../ruff.toml"
[tool.coverage.run]
branch = true
source = ["pp_current.model", "pp_current.event_time", "pp_current.operators", "pp_current.runtime", "pp_current.ingress", "pp_current.sinks", "pp_current.sources"]
[tool.coverage.report]
show_missing = true
