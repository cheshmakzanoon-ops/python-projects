[project]
name = "pp-strata"
version = "0.1.0"
description = "An original snapshot-isolated LSM byte-storage engine with verified recovery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
[project.scripts]
strata = "pp_strata.cli:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15"]
[tool.hatch.build.targets.wheel]
packages = ["src/pp_strata"]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.13"
strict = true
[tool.ruff]
extend = "../../ruff.toml"

[tool.coverage.run]
branch = true
source = ["pp_strata"]
omit = ["*/cli.py", "*/evidence.py", "*/workloads.py"]

[tool.coverage.report]
show_missing = true
