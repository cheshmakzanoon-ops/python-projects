[project]
name = "pp-pytrace"
version = "0.1.0"
description = "Pytrace: independent Python portfolio project"
requires-python = ">=3.13"
dependencies = ["libcst>=1.8", "jsonschema>=4.25"]
[project.scripts]
pytrace = "pp_pytrace.cli:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15", "types-jsonschema>=4.25"]
[tool.hatch.build.targets.wheel]
packages = ["src/pp_pytrace"]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.13"
strict = true
[tool.ruff]
extend = "../../ruff.toml"
extend-exclude = ["tests/fixtures/labeled"]
