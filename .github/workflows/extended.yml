name: Extended portfolio checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: select
        run: echo "matrix=$(python scripts/select_projects.py --all)" >> "$GITHUB_OUTPUT"
  compatibility:
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: portfolio
          POSTGRES_DB: portfolio
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U portfolio" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PORTFOLIO_PYTHON: ${{ matrix.python }}
      ANCHOR_DATABASE_URL: postgresql://portfolio@127.0.0.1:5432/portfolio
      MERIDIAN_DATABASE_URL: postgresql://portfolio@127.0.0.1:5432/portfolio
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m pip install uv==0.12.23
      - run: uv python install "$PORTFOLIO_PYTHON"
      - env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: echo "MERIDIAN_PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
      - run: python scripts/portfolio.py setup '${{ matrix.project }}'
      - run: python scripts/portfolio.py check '${{ matrix.project }}'
      - run: python scripts/portfolio.py demo '${{ matrix.project }}'
  standard:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: portfolio
          POSTGRES_DB: portfolio
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U portfolio" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANCHOR_DATABASE_URL: postgresql://portfolio@127.0.0.1:5432/portfolio
      MERIDIAN_DATABASE_URL: postgresql://portfolio@127.0.0.1:5432/portfolio
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m pip install uv==0.12.23
      - run: uv python install 3.13 3.14
      - env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: echo "MERIDIAN_PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
      - name: Install all independent products
        run: |
          python - <<'PY'
          import subprocess, tomllib
          for project in tomllib.load(open('portfolio.toml', 'rb'))['projects']:
              subprocess.run(['python', 'scripts/portfolio.py', 'setup', project['slug']], check=True)
          PY
      - name: Extended storage oracle
        working-directory: projects/02-strata
        run: uv run --locked python benchmarks/extended_stateful.py --output "$RUNNER_TEMP/strata-extended.json"
      - name: Standard benchmarks and public contract integrations
        run: |
          python - <<'PY'
          import subprocess, tomllib
          for project in tomllib.load(open('portfolio.toml', 'rb'))['projects']:
              subprocess.run(['python', 'scripts/portfolio.py', 'benchmark', project['slug'], '--profile', 'standard'], check=True)
          for integration in ['settlement', 'stream-lake', 'code-search']:
              subprocess.run(['python', 'scripts/portfolio.py', 'integration', integration], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: extended-evidence
          path: |
            .local/
            ${{ runner.temp }}/strata-extended.json
          include-hidden-files: true
