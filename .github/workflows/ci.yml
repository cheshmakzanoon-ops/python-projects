name: Portfolio CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --project tooling/quality --python 3.13.16
      - run: uv run --locked --project tooling/quality pytest scripts/tests
      - run: uv run --locked --project tooling/quality mypy --strict scripts/portfolio.py scripts/select_projects.py scripts/catalog.py scripts/check_architecture.py scripts/test_results.py scripts/summarize_verification.py
      - run: uv run --locked --project tooling/quality ruff format --check scripts integrations
      - run: uv run --locked --project tooling/quality ruff check scripts integrations
      - run: python scripts/portfolio.py docs
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          python scripts/select_projects.py --base "$BASE" --head "$HEAD" > matrix.json
          python - <<'PY'
          import json, os
          matrix = json.load(open('matrix.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
              output.write('count=' + str(len(matrix['include'])) + '\n')
          PY
  projects:
    needs: selection
    if: needs.selection.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: portfolio
          POSTGRES_DB: portfolio
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PORTFOLIO_PYTHON: ${{ matrix.python }}
      ANCHOR_DATABASE_URL: postgresql://portfolio@127.0.0.1:5432/portfolio
      MERIDIAN_DATABASE_URL: postgresql://portfolio@127.0.0.1:5432/portfolio
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m pip install uv==0.12.23
      - run: uv python install "$PORTFOLIO_PYTHON"
      - name: Use matching PostgreSQL backup tools
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: echo "MERIDIAN_PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
      - run: python scripts/portfolio.py setup '${{ matrix.project }}'
      - run: python scripts/portfolio.py check '${{ matrix.project }}'
      - run: python scripts/portfolio.py demo '${{ matrix.project }}'
      - run: python scripts/portfolio.py benchmark '${{ matrix.project }}' --profile ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-${{ matrix.project }}-${{ matrix.python }}
          path: |
            .local/${{ matrix.project }}/
            .local/checks/${{ matrix.project }}/
          include-hidden-files: true
  integrations:
    needs: selection
    if: needs.selection.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: portfolio
          POSTGRES_DB: portfolio
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PORTFOLIO_PYTHON: '3.14.8'
      ANCHOR_DATABASE_URL: postgresql://portfolio@127.0.0.1:5432/portfolio
      MERIDIAN_DATABASE_URL: postgresql://portfolio@127.0.0.1:5432/portfolio
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m pip install uv==0.12.23
      - run: uv python install "$PORTFOLIO_PYTHON"
      - name: Install products used by the public integrations
        run: |
          for project in anchor meridian current quarry pytrace atlas; do
            python scripts/portfolio.py setup "$project"
          done
      - run: python scripts/portfolio.py integration settlement
      - run: python scripts/portfolio.py integration stream-lake
      - run: python scripts/portfolio.py integration code-search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-evidence
          path: .local/integrations/
          include-hidden-files: true
  aggregate:
    if: always()
    needs: [selection, projects, integrations]
    runs-on: ubuntu-latest
    steps:
      - env:
          SELECTION: ${{ needs.selection.result }}
          PROJECTS: ${{ needs.projects.result }}
          INTEGRATIONS: ${{ needs.integrations.result }}
          COUNT: ${{ needs.selection.outputs.count }}
        run: |
          test "$SELECTION" = success
          if [ "$COUNT" = 0 ]; then
            test "$PROJECTS" = skipped
            test "$INTEGRATIONS" = skipped
          else
            test "$PROJECTS" = success
            test "$INTEGRATIONS" = success
          fi
