name: Portfolio CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python scripts/portfolio.py list
  projects:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [anchor, strata, current, meridian, quarry, pytrace, atlas, proving-ground, routecraft, resonance]
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m pip install uv==0.12.23
      - run: uv python install '${{ matrix.python }}'
      - run: python scripts/portfolio.py setup '${{ matrix.project }}'
      - run: python scripts/portfolio.py check '${{ matrix.project }}'
      - run: python scripts/portfolio.py demo '${{ matrix.project }}'
  aggregate:
    if: always()
    needs: [metadata, projects]
    runs-on: ubuntu-latest
    steps:
      - env:
          METADATA: ${{ needs.metadata.result }}
          PROJECTS: ${{ needs.projects.result }}
        run: test "$METADATA" = success && test "$PROJECTS" = success
