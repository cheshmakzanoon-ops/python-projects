name: Internal Source Export

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive checkout
        run: tar --exclude=.git -czf "$RUNNER_TEMP/python-projects-source.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: python-projects-source
          path: ${{ runner.temp }}/python-projects-source.tgz
          if-no-files-found: error
          retention-days: 1
